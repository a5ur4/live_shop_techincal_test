services:
  db:
    image: postgres:17-alpine
    # Credenciais padrão servem só para desenvolvimento local; em qualquer
    # outro ambiente defina POSTGRES_PASSWORD (veja .env.example).
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-feed}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-feed}
      POSTGRES_DB: ${POSTGRES_DB:-feed}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      target: runtime
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-feed}:${POSTGRES_PASSWORD:-feed}@db:5432/${POSTGRES_DB:-feed}
      # Vazio = chave aleatória a cada start (só dev). Em produção, defina no .env.
      JWT_SECRET: ${JWT_SECRET:-}
      JWT_EXPIRA_MINUTOS: ${JWT_EXPIRA_MINUTOS:-30}
    ports:
      - "${API_PORT:-8000}:8000"
    # Só fica "healthy" depois das migrations e com o banco respondendo; permite
    # `docker compose up --wait` e scripts que dependem da API pronta.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s
    depends_on:
      db:
        condition: service_healthy

  # Roda a suíte de testes dentro do Docker: `docker compose run --rm tests`
  tests:
    profiles: ["test"]
    build:
      context: .
      target: dev
    environment:
      TEST_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-feed}:${POSTGRES_PASSWORD:-feed}@db:5432/feed_test
    command: ["pytest"]
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
